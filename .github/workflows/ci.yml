name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf -d cf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest.py runs every database test against this server instead of in-memory SQLite.
      TEST_DATABASE_URL: postgresql+psycopg://cf:cf@localhost:5432/cf_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build and start PostgreSQL, backend and frontend
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test (no Codeforces calls)
        run: |
          set -eux
          curl --fail --silent http://localhost:8000/api/health
          curl --fail --silent http://localhost:8080/api/health          # through nginx
          curl --fail --silent http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://localhost:8080/some/spa/route | grep -q '<div id="root">'
          # Queries PostgreSQL through the API: an unknown user must be a clean 404.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/users/nobody/report)" = 404
      - name: Backend image also starts without DATABASE_URL (SQLite fallback)
        run: |
          docker run --detach --name sqlite-fallback --publish 8001:8000 "$(docker compose images --quiet backend)"
          for i in $(seq 1 30); do
            curl --fail --silent http://localhost:8001/api/health && exit 0
            sleep 1
          done
          docker logs sqlite-fallback
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
