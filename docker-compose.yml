# Runs PostgreSQL + the backend. Start with: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cf
      POSTGRES_PASSWORD: cf
      POSTGRES_DB: cf_trainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cf:cf@db:5432/cf_trainer
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
